budget:
  flights_lima_madrid_roundtrip: "1300–1800"
  accommodation_27_nights: "3900–5250"
  food_28_days: "2120–3020"
  intra_europe_transport: "1450–2300"
  activities: "1400–2000"
  jules_verne_dinner: "660–740"
  skiing_zermatt_1_day: "300–360"
  swiss_travel_pass_4day_x2: "620–660"
  warner_bros_studio: "160–200"
  misc: "500–800"
  total_min: 12410
  total_max: 17130
  target: 14000
  verdict: >
    HONEST WARNING — the midpoint is ~$14,770, still above the $14,000 target. Dropping
    Venice moved it by roughly $130, which is real but is not the lever that closes the
    gap. Line by line: lodging was a WASH ($200/night either way — the 27 nights are
    pinned by the flights, so the night moved to London rather than disappearing); food
    went UP ~$20 because London eats dearer; transport came DOWN $30–360, swapping
    Rome→Venice + Venice→Zermatt ($250–460 for 2) for one Rome→Geneva flight ($100–220)
    with the Swiss leg on the Travel Pass. If the Geneva fare is cheap you save ~$300;
    if it is dear it is break-even. The decision was bought with a calendar day, not
    cash. Small genuine wins created by the change: a 2-day Disney ticket now replaces
    two singles (~EUR 25–40/person), and activating the Swiss Pass on Sep 18 covers the
    Geneva→Zermatt arrival (~$70 free). Remaining levers: Taesch instead of Zermatt
    village (-$80/night), and book all intra-Europe transport 2–3 months ahead — worth
    $400–700 on its own.

