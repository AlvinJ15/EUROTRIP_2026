skiing:
  chosen: "Zermatt — Theodul Glacier, Switzerland"
  ski_days: 1
  ski_date: "2026-09-19"
  why: >
    The only option that satisfies BOTH "skiing is very important" AND "Switzerland is
    important" in a single stop, with zero detour on the Italy→France axis. Open
    year-round, so no opening-date gamble. The ski add-on itself is only ~$326 for 2
    (pass + rental) — the rest of the Swiss cost is the Switzerland leg you wanted anyway.
  reality_check: >
    September glacier lifts run ~07:00–13:00 and the snow softens by 11am. This is a
    spectacular half-day, not a ski week. Be on the first cable car.
  options:
    - name: "Zermatt — Theodul Glacier"
      country: "Switzerland (Valais)"
      opens: "YEAR-ROUND — zero risk"
      terrain_km: 21
      summit_m: 3899
      day_pass_chf: 95
      rental_per_day_chf: 50
      total_per_person_usd: 163
      total_for_2_ski_day_usd: 326
      stop_total_for_2_usd: 1590
      verdict: "CHOSEN"
      rating: "5/5"
    - name: "Val Senales Glacier"
      country: "Italy (South Tyrol)"
      opens: "~September 19 — dates routinely slip"
      terrain_km: 42
      summit_m: 3212
      day_pass_eur: 52
      rental_per_day_eur: 35
      total_per_person_usd: 95
      verdict: "REJECTED — best value and terrain, but opening-date risk plus a separate Switzerland leg costs more than it saves"
      rating: "3/5"
    - name: "Hintertux Glacier"
      country: "Austria (Tyrol)"
      opens: "YEAR-ROUND"
      terrain_km: 20
      summit_m: 3250
      day_pass_eur: 60
      rental_per_day_eur: 35
      total_per_person_usd: 103
      verdict: "REJECTED — fine glacier, wrong country for this route. Costs ~2 days."
      rating: "3/5"
  chile_alternative:
    note: >
      Chilean season runs mid-June to late Sept/early Oct. You land in Lima Sep 29, so
      early October is barely possible and NOVEMBER IS FULLY CLOSED. Cost for 2 would be
      ~$1,500–1,900 (flights + 3 nights + passes) for much more actual skiing — but it is
      a separate trip with a real chance the season closes on you. Not a substitute for
      the $326 Zermatt add-on.

scenic_trains:
  chosen:
    - name: "GoldenPass Express"
      route: "Interlaken → Montreux (Lake Geneva)"
      date: "2026-09-21"
      duration: "3 hours"
      price_per_person_usd: 45
      why: "Panoramic carriages, Bernese Oberland opening onto Lake Geneva — and it is ON the route to Paris. Zero detour."
    - name: "Gornergrat railway"
      route: "Zermatt → Gornergrat (3,089m)"
      date: "2026-09-20"
      duration: "33 minutes"
      price_per_person_usd: 98
      why: "Matterhorn head-on the whole way. Six times shorter than the Bernina, same impact."
  rejected:
    - name: "Bernina Express"
      route: "Tirano → Chur"
      why: >
        Beautiful but 4 hours of sitting, and it is in the eastern corner of Switzerland —
        5–6h from Zermatt in the wrong direction. Would have cost 2 days out of a 9-day
        window. The GoldenPass replaces it at zero cost in time.

dropped_from_previous_plan:
  - item: "Vienna"
    why: "Palaces, imperial history and classical music — heavy on museums, which you do not enjoy. Far east, costing a travel day."
  - item: "Bucharest"
    why: "Flying direct to Craiova now — no reason to route through it."
  - item: "Budapest"
    why: "No longer on the route once the trip starts in Spain."
  - item: "Bernina Express"
    why: "Wrong corner of Switzerland. Replaced by the GoldenPass Express."
  - item: "Pompeii day trip"
    why: "Rome is 3 nights and the Vatican + Colosseum own them."
  - item: "Louvre interior"
    why: "Your call — exterior and pyramid only."
  - item: "Paragliding Interlaken"
    why: "Only one Grindelwald night; the morning goes to the toboggan, zipline and Cliff Walk."

