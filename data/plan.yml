open_questions:
  - "Turkey is deliberately left flexible (3 days, Istanbul base). Swap to Cappadocia if you want the sunrise balloon — costs 2 internal flights."
  - "Grindelwald is only 1 night. If you want Jungfraujoch (3,454m, full day) as well, it needs a night stolen from Rome."
  - "Budget midpoint is ~$15,000 vs the $14,000 target — see budget.verdict for the levers."
