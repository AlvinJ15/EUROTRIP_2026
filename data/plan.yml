open_questions:
  - "TURKEY IS NOW 4 DAYS. This makes CAPPADOCIA genuinely viable: fly IST→NAV, sunrise balloon (~EUR 200/pp), and still keep 2 full Istanbul days. Best use of the extra night, and it is the only remaining open shaping decision."
  - "RESOLVED — THE CONTESTED NIGHT. Venice dropped, night given to London. See dropped_from_previous_plan for the full trade."
  - "ROME DAYS SWAPPED: Vatican moved to Thu Sep 17 because the shift put it on Wednesday = Papal Audience, when St Peter's is closed/restricted all morning."
  - "PARIS IMPROVED: the Swiss arrival now lands on Monday Sep 21, so both Disney days survive intact — Tue Sep 22 + Wed Sep 23, consecutive, 15-30min waits. The old busy Friday is gone from the plan."
  - "Grindelwald is still only 1 night (Sep 20-21). Jungfraujoch would need a night stolen from Rome or Paris."
  - "LONDON FRIDAY AFTERNOON is unallocated — Tower of London (~GBP 35) or a free Westminster/Thames walk. Decide on the day."
  - "Budget midpoint is ~$14,770 vs the $14,000 target — see budget.verdict for the remaining levers."
