trip:
  name: "Eurotrip 2026 — Alvin & Girlfriend"
  duration: "28 days / 27 nights"
  dates_revision: >
    VENICE DROPPED — both contested items resolved. Turkey Sep 8-12 (4n) | Greece 12-15 |
    Rome 15-18 | fly Rome->Geneva Sep 18 | Zermatt 18-20 | Grindelwald 20-21 | Paris 21-25
    | London 25-27 (2n) | Madrid 27-29. The Venice night went to London and the freed
    calendar day pulled everything one day earlier — which also landed Disney on
    Tue Sep 22 + Wed Sep 23, consecutive and the two lowest-crowd weekdays of the year.
