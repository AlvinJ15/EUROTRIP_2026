budget:
  flights_lima_madrid_roundtrip: "1300–1800"
  accommodation_27_nights: "4000–5400"
  food_28_days: "2100–3000"
  intra_europe_transport: "1600–2500"
  activities: "1400–2000"
  jules_verne_dinner: "660–740"
  skiing_zermatt_1_day: "300–360"
  swiss_travel_pass_4day_x2: "620–660"
  warner_bros_studio: "160–200"
  misc: "500–800"
  total_min: 12640
  total_max: 17460
  target: 14000
  verdict: >
    HONEST WARNING — the midpoint is ~$15,000, above your $14,000 target. This route has
    more transport legs (7 flights + 6 train journeys) and three expensive stops the old
    plan did not have: Zermatt, Venice and London. To get back to $14,000: drop the Venice
    night (-$320) and the Grindelwald night (-$380, but you lose the toboggan and the
    GoldenPass), or stay in Taesch instead of Zermatt village (-$80/night). Booking all
    intra-Europe transport 2–3 months ahead is worth $400–700 on its own.

