  target: 14000
  verdict: "$14,000 is achievable with discipline — Switzerland + Paris are the expensive anchors, offset by Prague/Budapest/Romania"

booking_priority:
  - order: 1
    what: "Jules Verne Restaurant"
    when_to_book: "June 2026 (90 days before your late August/September date)"
    urgency: "CRITICAL — sunset window seats fill within hours of opening"
    url: "restaurants-toureiffel.com"
  - order: 2
    what: "Disneyland Paris tickets"
    when_to_book: "3–4 months ahead"
    urgency: "High — advance midweek ~€89–100/person vs. €130+ same day"
    url: "disneylandparis.com"
  - order: 3
    what: "Vatican Museums skip-the-line"
    when_to_book: "2–3 months ahead"
    urgency: "High — queues are 2–3h without pre-booking"
    url: "vatican.va"
  - order: 4
    what: "Colosseum guided tour + VR add-on"
    when_to_book: "2 months ahead"
    urgency: "Medium-high"
    url: "ancientandrecent.com"
  - order: 5
    what: "Bernina Express seat reservation"
    when_to_book: "1–2 months ahead"
    urgency: "Medium — especially July/August"
    url: "sbb.ch"
  - order: 6
    what: "International flights Lima ↔ Europe"
    when_to_book: "NOW (6+ months ahead)"
    urgency: "CRITICAL — prices rise significantly closer to date"
    url: "Use KAYAK, Google Flights, ITA Matrix"
